worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Роутинг Webhook'ов напрямую в контейнер бота
        location /webhook/bot {
            proxy_pass http://bot:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Block external access to internal API
        location /api/internal/ {
            deny all;
            return 403;
        }

        # Роутинг API (будущий сайт и админка) в FastAPI
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Роутинг платежных вебхуков (Stripe) в FastAPI
        location /webhook/stripe {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
